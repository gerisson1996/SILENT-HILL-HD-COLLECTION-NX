# Silent Hill 3, from Silent Hill HD Collection (Xbox 360). The disc holds a launcher (default.xex) and one XEX per
# game; this project translates only sh3_360.xex, which reads its files from sh3_360\data.
[project]
name = "sh3"
sdk_version = "0.10.0"
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/sh3_360.xex"
out_directory_path = "generated/sh3"

# The includes are processed before this table, so whatever is set here overrides what is included.
#
#   overrides.toml  written by hand: specific findings, each with its explanation
#   thunks.toml     generated by tools/thunks.py: vtable thunks the analysis folded into other functions
#   huecos.toml     generated by tools/huecos.py: code gaps of >= 8 bytes
includes = ["overrides.toml", "thunks.toml", "huecos.toml"]
